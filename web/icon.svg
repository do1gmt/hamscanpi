<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hesperos DX: der Abendstern (Hesperos) sendet – Stern in der Mitte, Funkwellen nach beiden Seiten -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17293f"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- Stern -->
  <path d="M32 21 L34.6 29.4 L43 32 L34.6 34.6 L32 43 L29.4 34.6 L21 32 L29.4 29.4 Z" fill="#f5b942"/>
  <!-- Wellen innen -->
  <path d="M19 22 a14 14 0 0 0 0 20" fill="none" stroke="#2dd4bf" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M45 22 a14 14 0 0 1 0 20" fill="none" stroke="#2dd4bf" stroke-width="3.6" stroke-linecap="round"/>
  <!-- Wellen außen -->
  <path d="M12 15 a24 24 0 0 0 0 34" fill="none" stroke="#38bdf8" stroke-width="3.6" stroke-linecap="round" opacity=".6"/>
  <path d="M52 15 a24 24 0 0 1 0 34" fill="none" stroke="#38bdf8" stroke-width="3.6" stroke-linecap="round" opacity=".6"/>
</svg>
